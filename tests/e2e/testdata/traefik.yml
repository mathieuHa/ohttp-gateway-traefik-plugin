# Static Traefik configuration for the e2e suite. @@...@@ placeholders are
# replaced by the test harness (stack_test.go).
entryPoints:
  web:
    address: "127.0.0.1:@@WEB_PORT@@"

log:
  level: INFO

accessLog: {}

# /ping is the readiness probe: it answers once the plugin has been compiled.
ping:
  entryPoint: web

providers:
  file:
    filename: dynamic.yml
    watch: false

experimental:
  localPlugins:
    ohttp:
      moduleName: github.com/mathieuHa/ohttp-gateway-traefik-plugin
